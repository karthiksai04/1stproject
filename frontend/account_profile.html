<div class="account-profile">
    <div class="account-avatar" aria-hidden="true">{{ username[0]|upper }}</div>
    <div class="account-details">
        <span class="account-username">{{ username }}</span>
        <span class="account-session"><span class="account-session-dot"></span>Active Session</span>
    </div>
    <a class="account-logout" href="{{ url_for('logout') }}" aria-label="Log out" title="Log out">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
    </a>
</div>
